<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
	body { margin: 0; background: transparent; }
	#panel { width: 512px; height: 128px; background: rgba(0, 0, 0, 0.7); color: white; font: 48px sans-serif;
	         display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="panel">LOADING</div>
<script>
// A game's interstitials page in miniature: bootstraps only in an overlay, opens its mailbox, sends "ready" to the
// game's mailbox (test/mailbox) and publishes one panel.
if (window.VRHTML && VRHTML.Environment() === 2) {
	const ws = new WebSocket('ws://localhost:27062');
	ws.onopen = () => {
		ws.send('mailbox_open test/interstitials');
		ws.send('mailbox_send test/mailbox ' + JSON.stringify({ type: 'ready' }));
		console.log('sent ready');
	};
	ws.onmessage = e => console.log('received ' + e.data);
	VRHTML.UpdateSceneGraph(JSON.stringify({
		type: 'transform',
		properties: { translation: [0, 1.6, -2] },
		children: [{ type: 'panel', properties: { uv_min: [0, 0], uv_max: [0.5, 0.125], width: 1, debug_name: 'loading' } }]
	}));
}
</script>
</body>
</html>
